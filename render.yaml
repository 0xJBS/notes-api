services:
  - type: web
    name: notes-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "flask db upgrade && gunicorn app:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app.py
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: notes-api-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: notes-api-db
    plan: free
